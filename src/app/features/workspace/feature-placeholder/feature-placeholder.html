<section class="placeholder-shell">
  <app-page-header
    [eyebrow]="eyebrow"
    [title]="title"
    [description]="description"
  />

  <div class="placeholder-grid">
    <app-empty-state
      [title]="emptyTitle"
      [description]="emptyDescription"
      [note]="note"
    />

    @if (bullets.length) {
      <article class="detail-card">
        <h2>Points déjà confirmés</h2>
        <ul>
          @for (item of bullets; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
